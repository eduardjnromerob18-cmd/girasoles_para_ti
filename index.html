<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Victoria 🌻💛</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fffbee 0%, #fff2cc 50%, #ffe599 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(212, 160, 23, 0.25);
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 215, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .flower {
            font-size: 80px;
            animation: bounce 2.5s infinite ease-in-out;
            margin-bottom: 15px;
            display: inline-block;
            user-select: none;
        }

        h1 {
            color: #b8860b;
            font-size: 30px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #4a4a4a;
            margin-bottom: 25px;
        }

        .btn-surprise {
            background: linear-gradient(135deg, #ffd700, #ffae00);
            color: #4a3b00;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 174, 0, 0.4);
            transition: all 0.2s ease;
            outline: none;
            margin-bottom: 25px;
        }

        .btn-surprise:hover {
            background: linear-gradient(135deg, #ffae00, #ffd700);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 174, 0, 0.6);
        }

        .btn-surprise:active {
            transform: scale(0.98);
        }

        .signature {
            font-style: italic;
            color: #777;
            font-size: 15px;
            font-weight: 500;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            40% {
                transform: translateY(-18px) rotate(-3deg);
            }
            60% {
                transform: translateY(-9px) rotate(3deg);
            }
        }

        /* Destellos y elementos flotantes */
        .sparkle {
            position: absolute;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            animation: float 4s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.2); }
        }

        /* Partículas generadas dinámicamente */
        .falling-item {
            position: fixed;
            top: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 100;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Elementos decorativos flotantes de fondo -->
    <div class="sparkle" style="width: 16px; height: 16px; top: 12%; left: 18%; animation-delay: 0s;"></div>
    <div class="sparkle" style="width: 10px; height: 10px; top: 75%; left: 82%; animation-delay: 1s;"></div>
    <div class="sparkle" style="width: 22px; height: 22px; top: 82%; left: 12%; animation-delay: 2s;"></div>
    <div class="sparkle" style="width: 14px; height: 14px; top: 18%; left: 85%; animation-delay: 1.5s;"></div>

    <div class="container">
        <div class="flower">🌻💛✨</div>
        <h1>Para Victoria</h1>
        <p>Hay personas que iluminan la vida con solo presencia, y tú eres una de ellas. Estas flores amarillas son para recordarte lo especial que eres y lo mucho que alegras mis días.</p>
        
        <button class="btn-surprise" onclick="lanzarFlores()">¡Ver detalle! ✨</button>
        
        <div class="signature">Con todo mi cariño att: Eduard 💛</div>
    </div>

    <script>
        function lanzarFlores() {
            const emojis = ['🌻', '💛', '✨', '🌼', '💛'];
            const cantidad = 30;

            for (let i = 0; i < cantidad; i++) {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.classList.add('falling-item');
                    item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    item.style.left = Math.random() * 100 + 'vw';
                    item.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    item.style.fontSize = (Math.random() * 15 + 20) + 'px';
                    
                    document.body.appendChild(item);

                    setTimeout(() => {
                        item.remove();
                    }, 4000);
                }, i * 100);
            }
        }
    </script>

</body>
</html>
